<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BU Rangsit 3D Map</title>
<meta name="description" content="แผนที่เสมือน 3 มิติ มหาวิทยาลัยกรุงเทพ วิทยาเขตรังสิต สำรวจอาคารทั้ง 4 โซน ค้นหาอาคาร และเดินชมแบบมุมมองบุคคลที่หนึ่ง">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="scene" aria-label="แผนที่ 3 มิติของวิทยาเขต"></div>

  <aside id="sidebar" class="panel">
    <header class="brand">
      <div class="brand-text">
        <h1>BANGKOK UNIVERSITY</h1>
        <p>แผนที่เสมือน 3 มิติ · วิทยาเขตรังสิต</p>
      </div>
      <button type="button" id="list-toggle" class="btn small">รายชื่ออาคาร</button>
    </header>
    <div class="finder">
      <label class="search">
        <span class="sr-only">ค้นหาอาคาร</span>
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
        <input id="search" type="search" placeholder="ค้นหา เช่น หอสมุด, C6, เรือนไทย" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div id="zone-chips" class="chips" role="group" aria-label="กรองตามโซน"></div>
      <div id="cat-chips" class="chips" role="group" aria-label="กรองตามประเภท"></div>
      <p id="result-count" class="count"></p>
      <ul id="building-list" class="list"></ul>
      <p class="note">ชื่อและหมายเลขอาคารตามแผนผังทางการของมหาวิทยาลัย ส่วนตำแหน่ง ขนาด และรูปทรงในโมเดลเป็นค่าประมาณ</p>
    </div>
  </aside>

  <section id="info" class="panel" hidden aria-live="polite"></section>

  <div id="dock">
    <p id="hint" class="hint"></p>
    <div id="toolbar" class="panel" role="toolbar" aria-label="เครื่องมือแผนที่">
      <div class="seg">
        <button type="button" id="mode-orbit" class="tool" aria-pressed="true">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6l4.5-2 5 2L17 4v10l-4.5 2-5-2L3 16z"/><path d="M7.5 4v10M12.5 6v10"/></svg>
          <span class="txt">มุมมองแผนที่</span>
        </button>
        <button type="button" id="mode-walk" class="tool" aria-pressed="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="11" cy="3.5" r="1.8"/><path d="M8 18l2.5-6 2.5 2v4M10.5 12l.5-5-3 1.5L7 11M11 7l2.5 2.5L16 10"/></svg>
          <span class="txt">เดินชม</span>
        </button>
      </div>
      <button type="button" id="toggle-night" class="tool" aria-pressed="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg>
        <span class="txt">กลางวัน</span>
      </button>
      <button type="button" id="toggle-labels" class="tool" aria-pressed="true">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h9l5 5-5 5H3z"/><circle cx="7" cy="10" r="1.2"/></svg>
        <span class="txt">ป้ายชื่อ</span>
      </button>
      <button type="button" id="reset-view" class="tool">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10a6 6 0 1 0 2-4.5"/><path d="M4 3v3.5h3.5"/></svg>
        <span class="txt">มุมเริ่มต้น</span>
      </button>
    </div>
  </div>

  <div id="minimap-wrap" class="panel">
    <div class="mini-head"><span>ผังวิทยาเขต</span><span class="mini-sub"><b class="north">▲ เหนือ</b> · แตะเพื่อไปยังจุดนั้น</span></div>
    <canvas id="minimap" aria-label="ผังวิทยาเขตแบบย่อ"></canvas>
  </div>

  <div id="walk-hud" hidden>
    <div class="crosshair" aria-hidden="true"></div>
    <div class="pad" aria-label="ปุ่มเดิน">
      <button type="button" data-move="fwd" class="pad-up" aria-label="เดินหน้า">▲</button>
      <button type="button" data-move="left" class="pad-left" aria-label="ก้าวซ้าย">◀</button>
      <button type="button" data-move="run" class="pad-run" aria-label="วิ่ง">วิ่ง</button>
      <button type="button" data-move="right" class="pad-right" aria-label="ก้าวขวา">▶</button>
      <button type="button" data-move="back" class="pad-down" aria-label="ถอยหลัง">▼</button>
    </div>
  </div>

  <div id="loading">กำลังสร้างวิทยาเขต…</div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
